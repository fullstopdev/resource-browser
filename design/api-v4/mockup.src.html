<style>
:root{--bg:#f6f7f9;--surface:#fff;--raised:#f0f2f5;--line:#e3e6eb;--line-strong:#cdd2da;--ink:#0f1726;--ink-2:#3a4456;--ink-3:#6a7385;--signal:#1450d8;--signal-soft:#e8effd;--signal-ink:#fff;--ok:#0e7a4a;
--font:'IBM Plex Sans',system-ui,sans-serif;--mono:'IBM Plex Mono',ui-monospace,Menlo,monospace}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0c111a;--surface:#121926;--raised:#1a2232;--line:#232d3f;--line-strong:#344157;--ink:#e8edf5;--ink-2:#b4bdcc;--ink-3:#8590a3;--signal:#6c9bff;--signal-soft:#18264a;--signal-ink:#0c111a;--ok:#4cc68b;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#0c111a;--surface:#121926;--raised:#1a2232;--line:#232d3f;--line-strong:#344157;--ink:#e8edf5;--ink-2:#b4bdcc;--ink-3:#8590a3;--signal:#6c9bff;--signal-soft:#18264a;--signal-ink:#0c111a;--ok:#4cc68b;color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font:14px/1.5 var(--font)}
a{color:inherit}
.note{padding-block:.75rem;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));background:var(--signal-soft);color:var(--ink-2);font-size:.85rem;border-bottom:1px solid var(--line)}
.note b{color:var(--ink)}
.note button{margin-left:.5rem;border:1px solid var(--line-strong);background:var(--surface);color:var(--ink);border-radius:6px;padding:.15rem .6rem;font:600 .8rem var(--font);cursor:pointer}
.top{display:flex;align-items:center;gap:1.5rem;height:56px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));background:var(--surface);border-bottom:1px solid var(--line)}
.top b{font-weight:700}.top span{color:var(--ink-3);font-size:.85rem}
.shell{display:grid;grid-template-columns:minmax(0,1fr);max-width:90rem;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
@media(min-width:1000px){.shell{grid-template-columns:16.5rem minmax(0,1fr);gap:2.5rem}}
nav.side{display:none;padding-block:1.5rem}
@media(min-width:1000px){nav.side{display:block;position:sticky;top:0;align-self:start;max-height:100vh;overflow:auto}}
.side .ov{display:flex;align-items:center;gap:.6rem;padding:.45rem .6rem;border-radius:7px;font-weight:600;text-decoration:none}
.side h4{margin:1.1rem .6rem .35rem;font:600 .66rem var(--mono);letter-spacing:.08em;text-transform:uppercase;color:var(--ink-3)}
.side ul{list-style:none;margin:0;padding:0}
.side .cat{display:grid;grid-template-columns:1.25rem minmax(0,1fr) auto;align-items:center;gap:.6rem;padding:.42rem .6rem;border-radius:7px;text-decoration:none;color:var(--ink-2);font-weight:500}
.side .cat:hover,.side .ov:hover{background:var(--raised);color:var(--ink)}
.side .cat[aria-current],.side .ov[aria-current]{background:var(--signal-soft);color:var(--signal);font-weight:600}
.side .cat small{font:.72rem var(--mono);color:var(--ink-3)}
.side .apis{margin:.15rem 0 .5rem 1.45rem;padding-left:.6rem;border-left:1px solid var(--line)}
.side .apis a{display:flex;justify-content:space-between;padding:.28rem .5rem;border-radius:6px;text-decoration:none;color:var(--ink-2);font-size:.86rem}
.side .apis a:hover{background:var(--raised)}
.side .apis small{font:.7rem var(--mono);color:var(--ink-3)}
svg.i{width:1.15rem;height:1.15rem;fill:none;stroke:currentColor;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
main{min-width:0;padding-block:1.75rem 3rem}
.crumb{font:500 .75rem var(--mono);color:var(--ink-3);margin:0}
.crumb a{color:var(--ink-3)}
h1{margin:.35rem 0 .25rem;font:700 clamp(1.6rem,3vw,2.1rem)/1.15 var(--font);letter-spacing:-.02em;display:flex;flex-wrap:wrap;align-items:center;gap:.6rem}
.rel{font:600 .78rem var(--mono);background:var(--signal-soft);color:var(--signal);padding:.15rem .45rem;border-radius:5px;letter-spacing:0}
.lede{margin:0;color:var(--ink-2);max-width:68ch}
.search{position:relative;margin-top:1.25rem;max-width:44rem}
.search svg{position:absolute;left:1rem;top:50%;transform:translateY(-50%);color:var(--ink-3)}
.search input{width:100%;height:3.1rem;padding:0 1rem 0 2.9rem;border:1px solid var(--line-strong);border-radius:10px;background:var(--surface);color:var(--ink);font:500 1rem var(--font);box-shadow:0 10px 30px -20px rgba(10,30,80,.35)}
.search input:focus{outline:2px solid var(--signal);outline-offset:1px}
.hits{position:absolute;left:0;right:0;top:calc(100% + 6px);z-index:9;list-style:none;margin:0;padding:6px;background:var(--surface);border:1px solid var(--line);border-radius:10px;box-shadow:0 18px 40px -18px rgba(10,30,80,.45)}
.hits a{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:0 1rem;padding:.45rem .6rem;border-radius:6px;text-decoration:none}
.hits a:hover,.hits a.on{background:var(--raised)}
.hits b{font-weight:600}.hits span{font:.72rem var(--mono);color:var(--ink-3)}.hits em{grid-row:1/3;grid-column:2;align-self:center;font:normal .7rem var(--mono);color:var(--ink-3)}
section{margin-top:2.25rem}
h2{margin:0 0 .85rem;font:700 1.05rem var(--font)}
.h2row{display:flex;justify-content:space-between;align-items:baseline;gap:1rem}
.h2row span{font:.75rem var(--mono);color:var(--ink-3)}
.tiles{display:grid;grid-template-columns:minmax(0,1fr);gap:.85rem;list-style:none;margin:0;padding:0}
@media(min-width:640px){.tiles{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media(min-width:1180px){.tiles{grid-template-columns:repeat(3,minmax(0,1fr))}}
.tile{display:grid;grid-template-columns:2.5rem minmax(0,1fr);gap:.25rem .9rem;height:100%;padding:1.05rem 1.1rem;background:var(--surface);border:1px solid var(--line);border-radius:12px;text-decoration:none;transition:border-color .15s,box-shadow .15s,transform .15s}
.tile:hover{border-color:var(--signal);box-shadow:0 16px 34px -26px rgba(10,30,80,.55);transform:translateY(-1px)}
.tile .ic{grid-row:1/4;width:2.5rem;height:2.5rem;display:grid;place-items:center;border-radius:9px;background:var(--signal-soft);color:var(--signal)}
.tile .ic svg{width:1.3rem;height:1.3rem}
.tile b{font-size:1rem;font-weight:600}
.tile p{margin:0;font-size:.84rem;color:var(--ink-3)}
.tile .stats{font:500 .72rem var(--mono);color:var(--ink-2)}
.tile .ex{grid-column:2;display:flex;flex-wrap:wrap;gap:.3rem;margin-top:.5rem}
.tile .ex span{font:.72rem var(--mono);padding:.1rem .4rem;border-radius:4px;background:var(--raised);color:var(--ink-2)}
.pop{display:flex;flex-wrap:wrap;gap:.4rem}
.pop a{display:inline-flex;align-items:center;gap:.45rem;height:2.1rem;padding:0 .75rem;border:1px solid var(--line);border-radius:8px;background:var(--surface);font:500 .82rem var(--mono);text-decoration:none}
.pop a:hover{border-color:var(--signal);color:var(--signal)}
.pop a small{font:.66rem var(--font);color:var(--ink-3)}
.core{display:flex;flex-wrap:wrap;gap:.25rem .9rem;padding:.9rem 1.1rem;background:var(--surface);border:1px solid var(--line);border-radius:12px}
.core a{font-size:.86rem;color:var(--ink-2);text-decoration:none}
.core a:hover{color:var(--signal);text-decoration:underline}
.basics{display:grid;gap:.4rem;padding:1rem 1.1rem;background:var(--surface);border:1px solid var(--line);border-radius:12px;font-size:.85rem;color:var(--ink-3)}
.basics div{display:grid;grid-template-columns:7rem minmax(0,1fr);gap:1rem}
.basics dt{font:600 .66rem var(--mono);letter-spacing:.08em;text-transform:uppercase;padding-top:.15rem}
.basics dd{margin:0}.basics code{font:.8rem var(--mono);color:var(--ink)}
.catHead{display:flex;gap:1rem;align-items:flex-start}
.catHead .ic{flex:none;width:3rem;height:3rem;display:grid;place-items:center;border-radius:11px;background:var(--signal-soft);color:var(--signal);margin-top:.4rem}
.catHead .ic svg{width:1.5rem;height:1.5rem}
.bar{display:flex;flex-wrap:wrap;gap:.6rem;align-items:center;margin-top:1.25rem}
.bar .search{margin:0;flex:1 1 18rem}
.bar .search input{height:2.6rem;font-size:.92rem;box-shadow:none}
.seg{display:inline-flex;border:1px solid var(--line-strong);border-radius:8px;overflow:hidden;background:var(--surface)}
.seg button{border:0;background:none;padding:0 .85rem;height:2.5rem;font:600 .82rem var(--font);color:var(--ink-2);cursor:pointer}
.seg button+button{border-left:1px solid var(--line)}
.seg button[aria-pressed=true]{background:var(--ink);color:var(--bg)}
.tbl{margin-top:1rem;background:var(--surface);border:1px solid var(--line);border-radius:12px;overflow:hidden}
table{width:100%;border-collapse:collapse}
th{text-align:left;font:600 .66rem var(--mono);letter-spacing:.08em;text-transform:uppercase;color:var(--ink-3);padding:.6rem 1rem;border-bottom:1px solid var(--line);background:var(--raised)}
td{padding:.55rem 1rem;border-top:1px solid var(--line);vertical-align:baseline}
tr.api td{background:var(--bg);padding-top:.75rem;padding-bottom:.45rem}
tr.api b{font-weight:700}tr.api span{margin-left:.6rem;font:.72rem var(--mono);color:var(--ink-3)}
tr.api a.all{float:right;font-size:.8rem;font-weight:600;color:var(--signal);text-decoration:none}
td.k a{font:600 .86rem var(--mono);text-decoration:none}
td.k a:hover{color:var(--signal);text-decoration:underline}
.wf{margin-left:.45rem;font:600 .58rem var(--mono);letter-spacing:.05em;text-transform:uppercase;padding:.05rem .3rem;border:1px dashed var(--line-strong);border-radius:4px;color:var(--ink-3)}
td.sc{font-size:.8rem;color:var(--ink-2);white-space:nowrap}
td.n{font:.8rem var(--mono);color:var(--ink-3);text-align:right}
td.p{font:.76rem var(--mono);color:var(--ink-3);overflow-wrap:anywhere}
td.p i{font-style:normal;color:#7a4cc2}
@media(max-width:760px){thead{display:none}tr.res{display:grid;grid-template-columns:minmax(0,1fr) auto;padding:.55rem 1rem;border-top:1px solid var(--line)}tr.res td{border:0;padding:0}td.sc{grid-column:2;grid-row:1}td.n{display:none}td.p{grid-column:1/-1}tr.api{display:block}tr.api td{display:block}}
.pn{display:flex;justify-content:space-between;gap:1rem;margin-top:1.5rem}
.pn a{display:grid;padding:.7rem 1rem;border:1px solid var(--line);border-radius:10px;background:var(--surface);text-decoration:none;min-width:0}
.pn a small{font:.7rem var(--mono);color:var(--ink-3)}.pn a b{font-weight:600}
.pn a:hover{border-color:var(--signal)}
a:focus-visible,button:focus-visible{outline:2px solid var(--signal);outline-offset:2px}
@media(prefers-reduced-motion:reduce){.tile{transition:none}.tile:hover{transform:none}}
</style>
